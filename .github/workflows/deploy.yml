name: "CD · Promote QUA → PRD"

# DEV is your design workspace — you build and test there by hand.
# Promotion starts when the artifact reaches main (via Git Push + PR merge):
#   merge to main ──► deploy QUA (auto) ──► deploy PRD (manual approval)
on:
  push:
    branches: [main]
    paths:
      - "Test_iFlow_DEV/**"   # the folder CPI's Git Push creates (= SOURCE_DIR)
      - "config/**"
      - "scripts/**"
  workflow_dispatch: {}   # manual "Run workflow" button — handy during a demo

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-qua:
    name: "Deploy QUA"
    runs-on: ubuntu-latest
    environment: qua      # add a required reviewer here too, if QUA should also wait
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to QUA package
        env:
          CPI_TOKEN_URL: ${{ secrets.CPI_TOKEN_URL }}
          CPI_CLIENT_ID: ${{ secrets.CPI_CLIENT_ID }}
          CPI_CLIENT_SECRET: ${{ secrets.CPI_CLIENT_SECRET }}
          CPI_API_URL: ${{ secrets.CPI_API_URL }}
        run: bash scripts/deploy.sh qua
      - name: Summary
        if: success()
        run: echo "## 🚀 QUA deployed (commit \`${GITHUB_SHA::7}\` by @${GITHUB_ACTOR})" >> "$GITHUB_STEP_SUMMARY"

  deploy-prd:
    name: "Promote PRD"
    runs-on: ubuntu-latest
    needs: deploy-qua
    environment: prd      # strongly recommended: required reviewer on prd
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to PRD package
        env:
          CPI_TOKEN_URL: ${{ secrets.CPI_TOKEN_URL }}
          CPI_CLIENT_ID: ${{ secrets.CPI_CLIENT_ID }}
          CPI_CLIENT_SECRET: ${{ secrets.CPI_CLIENT_SECRET }}
          CPI_API_URL: ${{ secrets.CPI_API_URL }}
        run: bash scripts/deploy.sh prd
      - name: Summary
        if: success()
        run: echo "## 🏁 PRD deployed — pipeline complete" >> "$GITHUB_STEP_SUMMARY"
